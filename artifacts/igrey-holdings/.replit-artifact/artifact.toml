kind = "web"
previewPath = "/"
title = "iGrey Holdings"
description = "A premium property management website for iGrey Holdings in Bangalore, helping people rent, lease, and buy with clarity and confidence."
version = "1.0.0"
id = "artifacts/igrey-holdings"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25302

[services.development]
run = "pnpm --filter @workspace/igrey-holdings run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/igrey-holdings", "run", "build" ]
serve = "static"
publicDir = "artifacts/igrey-holdings/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25302"
BASE_PATH = "/"
